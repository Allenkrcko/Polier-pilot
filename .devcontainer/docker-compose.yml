# Codespaces overlay on the project's docker-compose.yml.
# - Mounts the repo at /workspace so VS Code can edit live.
# - Adds a default .env so the stack boots without prompting.
# - Override `app` command to run uvicorn with reload, no auto-start of worker
#   (developer can `python -m app.workers.runner` manually in a terminal).
services:
  app:
    extends:
      file: ../docker-compose.yml
      service: app
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    env_file:
      - ../.env
    command: ["sleep", "infinity"]   # Codespaces keeps the container alive; we run uvicorn from postCreate
